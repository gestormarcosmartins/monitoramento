name: central-monitor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      CENTRAL_DB_PASSWORD: ${CENTRAL_DB_PASSWORD}
      ZABBIX_DB_PASSWORD: ${ZABBIX_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    mem_limit: 1g
    cpus: 0.60

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    mem_limit: 384m
    cpus: 0.25

  api:
    build: ./services/backend
    restart: unless-stopped
    command: ["uvicorn", "central_monitor.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &backend-environment
      CENTRAL_DATABASE_URL: postgresql://central_app:${CENTRAL_DB_PASSWORD}@postgres:5432/central_monitor
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-2}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-12}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      REDIS_URL: redis://redis:6379/0
      CENTRAL_SECRET_KEY: ${CENTRAL_SECRET_KEY}
      CENTRAL_PUBLIC_URL: ${CENTRAL_PUBLIC_URL:-http://localhost:8090}
      ZABBIX_API_URL: ${ZABBIX_API_URL}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN}
      ZABBIX_USERNAME: ${ZABBIX_USERNAME:-Admin}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD:-zabbix}
      GLPI_API_URL: ${GLPI_API_URL:-http://glpi/apirest.php}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_USERNAME: ${GLPI_USERNAME:-glpi}
      GLPI_PASSWORD: ${GLPI_PASSWORD:-glpi}
      SMTP_HOST: ${SMTP_HOST:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@nexora.local}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@nexora.local}
      SMTP_TLS: ${SMTP_TLS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OIDC_ISSUER: ${OIDC_ISSUER:-${CENTRAL_PUBLIC_URL:-http://localhost:8090}/auth/realms/central-monitor}
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/central-monitor/protocol/openid-connect/certs
      OIDC_AUDIENCE: central-monitor
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: central-monitor
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-true}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-30}
      ACTION_EXECUTION_ENABLED: ${ACTION_EXECUTION_ENABLED:-false}
      BENNER_INGEST_TOKEN: ${BENNER_INGEST_TOKEN:-}
      PUSH_TOKEN_KEY: ${PUSH_TOKEN_KEY:-}
      BUSINESS_SIGNING_KEY: ${BUSINESS_SIGNING_KEY:-}
      EXPO_PROJECT_IDS: ${EXPO_PROJECT_IDS:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      private:
        ipv4_address: 172.30.250.10
    mem_limit: 512m
    cpus: 0.50

  worker:
    build: ./services/backend
    restart: unless-stopped
    command: ["python", "-m", "central_monitor.worker"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
      glpi-bootstrap:
        condition: service_completed_successfully
    networks:
      private:
        ipv4_address: 172.30.250.11
    mem_limit: 512m
    cpus: 0.75

  action-orchestrator:
    build: ./services/backend
    restart: unless-stopped
    command: ["uvicorn", "central_monitor.orchestrator:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [private]
    mem_limit: 256m
    cpus: 0.25

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    restart: unless-stopped
    command: ["start-dev", "--http-relative-path=/auth", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      CENTRAL_PUBLIC_URL: ${CENTRAL_PUBLIC_URL:-http://localhost:8090}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx1024m
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    mem_limit: 1536m
    cpus: 0.75

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix_app
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_STARTPOLLERS: 5
      ZBX_CACHESIZE: 128M
      ZBX_HISTORYCACHESIZE: 64M
      ZBX_TRENDCACHESIZE: 32M
      ZBX_VALUECACHESIZE: 64M
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    mem_limit: 1536m
    cpus: 0.75

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix_app
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      PHP_TZ: America/Sao_Paulo
    depends_on:
      - zabbix-server
    networks: [private]
    mem_limit: 512m
    cpus: 0.40

  glpi-db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:-${CENTRAL_DB_PASSWORD}}
    volumes:
      - glpi-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [private]
    mem_limit: 768m
    cpus: 0.40

  glpi:
    image: glpi/glpi:11.0.7
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:-${CENTRAL_DB_PASSWORD}}
      GLPI_CRONTAB_ENABLED: "1"
      TZ: America/Sao_Paulo
    volumes:
      - glpi-data:/var/glpi
    depends_on:
      glpi-db:
        condition: service_healthy
    networks: [private]
    mem_limit: 1024m
    cpus: 0.60

  glpi-bootstrap:
    image: mariadb:11.8
    restart: "no"
    environment:
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:-${CENTRAL_DB_PASSWORD}}
    volumes:
      - ./infra/glpi/bootstrap.sh:/bootstrap.sh:ro
    command: ["sh", "/bootstrap.sh"]
    depends_on:
      glpi-db:
        condition: service_healthy
      glpi:
        condition: service_started
    networks: [private]
    mem_limit: 128m
    cpus: 0.10

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CENTRAL_BIND_ADDRESS:-127.0.0.1}:${CENTRAL_HTTP_PORT:-8090}:80"
    environment:
      BENNER_MONITOR_UPSTREAM: ${BENNER_MONITOR_UPSTREAM:-http://host.docker.internal:8091}
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./services/mobile:/usr/share/nginx/mobile:ro
      - ./infra/wellknown:/usr/share/nginx/wellknown:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      zabbix-web:
        condition: service_started
      keycloak:
        condition: service_started
    networks: [private]
    mem_limit: 128m
    cpus: 0.15

  web:
    build: ./services/web
    restart: unless-stopped
    networks: [private]
    mem_limit: 128m
    cpus: 0.15

volumes:
  postgres-data:
  redis-data:
  glpi-db-data:
  glpi-data:

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24
          ip_range: 172.30.250.128/25

